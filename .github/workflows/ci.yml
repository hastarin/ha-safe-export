name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.13 is the project floor (the oldest Python the integration's minimum
        # Home Assistant runs on); 3.14 is what development uses.
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -e ".[tools]" ruff pytest mypy

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest

      - name: Type check (non-blocking)
        run: mypy
        continue-on-error: true

  integration:
    # The Safe Export custom integration, under Home Assistant's own test harness.
    # Separate job: the harness pins an HA release that needs a newer Python than
    # the main suite targets.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: pip install -e ".[ha]"

      - name: Test integration
        run: pytest tests_ha
